<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>Todo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    h1 { font-size: 1.4rem; margin: 0 0 16px; font-weight: 650; }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    input[type="text"] {
      flex: 1;
      border: 1px solid #334155;
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      background: var(--accent);
      color: #0f172a;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--muted);
      padding: 8px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border-radius: 14px;
      padding: 12px 12px 12px 14px;
    }
    li.done span { color: var(--muted); text-decoration: line-through; }
    li span { flex: 1; word-break: break-word; }
    .check {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 2px solid var(--muted);
      background: transparent;
      padding: 0;
      flex-shrink: 0;
    }
    li.done .check {
      border-color: var(--ok);
      background: var(--ok);
    }
    .del { color: var(--danger); font-size: 18px; line-height: 1; }
    .empty { color: var(--muted); text-align: center; padding: 32px 8px; }
    .hint { color: var(--muted); font-size: 0.85rem; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <h1>Todo</h1>
  <form class="row" id="form">
    <input id="input" type="text" placeholder="Add a task" autocomplete="off" enterkeyhint="done" />
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <p class="hint">Saved on this device. On iPhone: Share → Add to Home Screen.</p>
  <script>
    const KEY = "todo-app-v1";
    const listEl = document.getElementById("list");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch { return []; }
    }
    function save(items) {
      localStorage.setItem(KEY, JSON.stringify(items));
    }
    function render() {
      const items = load();
      listEl.innerHTML = "";
      if (!items.length) {
        listEl.innerHTML = '<li class="empty" style="display:block">No tasks yet</li>';
        return;
      }
      items.forEach((item, i) => {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");
        const check = document.createElement("button");
        check.type = "button";
        check.className = "check";
        check.setAttribute("aria-label", "Toggle done");
        check.onclick = () => {
          items[i].done = !items[i].done;
          save(items);
          render();
        };
        const span = document.createElement("span");
        span.textContent = item.text;
        const del = document.createElement("button");
        del.type = "button";
        del.className = "ghost del";
        del.setAttribute("aria-label", "Delete");
        del.textContent = "×";
        del.onclick = () => {
          items.splice(i, 1);
          save(items);
          render();
        };
        li.append(check, span, del);
        listEl.appendChild(li);
      });
    }
    form.onsubmit = (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const items = load();
      items.unshift({ text, done: false });
      save(items);
      input.value = "";
      render();
    };
    render();
  </script>
</body>
</html>

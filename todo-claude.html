<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Todo List</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #7b8794;
      --line: #e4e7eb;
      --accent: #4f46e5;
      --danger: #e11d48;
      --rest: #059669;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --card: #1b1e25;
        --text: #e6e8eb;
        --muted: #8a919c;
        --line: #2a2e37;
        --accent: #818cf8;
        --danger: #fb7185;
        --rest: #34d399;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: max(24px, env(safe-area-inset-top)) 16px 32px;
    }
    main { max-width: 520px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .sub { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
    form { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
    }
    .add {
      padding: 0 18px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .filters { display: flex; gap: 4px; margin-bottom: 12px; }
    .filters button {
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .filters button[aria-pressed="true"] {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 0 0 1px var(--line);
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
    }
    li:first-child { border-top: 0; }
    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    li .text { flex: 1; word-break: break-word; cursor: text; }
    li.done .text { color: var(--muted); text-decoration: line-through; }
    li .edit { flex: 1; padding: 6px 8px; }
    .del {
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 6px;
    }
    .del:hover { color: var(--danger); }
    .empty { color: var(--muted); text-align: center; padding: 28px 12px; }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer button { color: var(--muted); }
    footer button:hover { color: var(--danger); }
    footer button[hidden] { display: none; }
    .timer {
      --phase: var(--accent);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: grid;
      gap: 10px;
    }
    .timer.rest { --phase: var(--rest); }
    .timer-top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; color: var(--muted); }
    .phase { color: var(--phase); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .clock {
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: var(--phase);
    }
    .focus { text-align: center; color: var(--muted); font-size: 0.95rem; min-height: 1.4em; word-break: break-word; }
    .focus strong { color: var(--text); }
    .bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
    .bar div { height: 100%; width: 0; background: var(--phase); transition: width 0.25s linear; }
    .controls { display: flex; gap: 8px; }
    .controls button { flex: 1; padding: 10px; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); }
    .controls .add { background: var(--phase); box-shadow: none; }
    .settings { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; color: var(--muted); font-size: 0.9rem; }
    .settings input {
      width: 3.6em;
      padding: 4px 6px;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      text-align: center;
    }
    .play { color: var(--muted); padding: 4px 6px; border-radius: 6px; font-size: 0.9rem; }
    .play:hover, li.focused .play { color: var(--accent); }
    li.focused { box-shadow: inset 3px 0 0 var(--accent); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Todo List</h1>
    <p class="sub">Double-click a task to edit it. Tap ▶ on a task to focus on it with the timer.</p>

    <section class="timer" id="timer" aria-label="Tabata timer">
      <div class="timer-top">
        <span class="phase" id="phase">Ready</span>
        <span id="round"></span>
      </div>
      <div class="clock" id="clock" role="timer">20:00</div>
      <div class="focus" id="focus"></div>
      <div class="bar"><div id="bar"></div></div>
      <div class="controls">
        <button type="button" class="add" id="start">Start</button>
        <button type="button" id="skip">Skip</button>
        <button type="button" id="reset">Reset</button>
      </div>
      <div class="settings">
        <label>Work <input id="work" type="number" min="1" max="180" inputmode="numeric" /> min</label>
        <label>Rest <input id="rest" type="number" min="1" max="60" inputmode="numeric" /> min</label>
        <label>Rounds <input id="rounds" type="number" min="1" max="20" inputmode="numeric" /></label>
      </div>
    </section>

    <form id="form">
      <input id="input" type="text" placeholder="What needs doing?" autocomplete="off" aria-label="New task" />
      <button class="add" type="submit">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="list"></ul>

    <footer>
      <span id="count"></span>
      <button type="button" id="clear">Clear completed</button>
    </footer>
  </main>

  <script>
    const KEY = "todo-claude-v1";
    const $ = (id) => document.getElementById(id);
    const list = $("list");
    const input = $("input");

    let filter = "all";
    let todos = load();

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch { return []; }
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {}
    }

    function update() {
      save();
      render();
    }

    function render() {
      const shown = todos.filter((t) =>
        filter === "all" ? true : filter === "done" ? t.done : !t.done
      );

      list.innerHTML = "";
      if (!shown.length) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = todos.length ? "Nothing here." : "No tasks yet. Add one above.";
        list.append(li);
      }

      for (const t of shown) {
        const li = document.createElement("li");
        li.classList.toggle("done", t.done);

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = t.done;
        box.setAttribute("aria-label", "Mark done");
        box.onchange = () => { t.done = box.checked; update(); };

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = t.text;
        text.ondblclick = () => startEdit(li, text, t);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "del";
        del.textContent = "×";
        del.setAttribute("aria-label", "Delete task");
        del.onclick = () => { todos = todos.filter((x) => x !== t); update(); };

        const play = document.createElement("button");
        play.type = "button";
        play.className = "play";
        play.textContent = "▶";
        play.setAttribute("aria-label", "Focus on this task");
        play.onclick = () => { focusId = focusId === t.id ? null : t.id; saveTimer(); render(); };
        li.classList.toggle("focused", t.id === focusId);

        li.append(box, text, play, del);
        list.append(li);
      }

      const left = todos.filter((t) => !t.done).length;
      $("count").textContent = `${left} ${left === 1 ? "task" : "tasks"} left`;
      $("clear").hidden = !todos.some((t) => t.done);
      renderTimer();
    }

    function startEdit(li, text, t) {
      const field = document.createElement("input");
      field.type = "text";
      field.className = "edit";
      field.value = t.text;
      let finished = false;
      const finish = (commit) => {
        if (finished) return;
        finished = true;
        const value = field.value.trim();
        if (commit) {
          if (value) t.text = value;
          else todos = todos.filter((x) => x !== t);
        }
        update();
      };
      field.onkeydown = (e) => {
        if (e.key === "Enter") finish(true);
        if (e.key === "Escape") finish(false);
      };
      field.onblur = () => finish(true);
      li.replaceChild(field, text);
      field.focus();
      field.select();
    }

    $("form").onsubmit = (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      todos.push({ id: Date.now() + Math.random(), text: value, done: false });
      input.value = "";
      update();
    };

    document.querySelectorAll("[data-filter]").forEach((btn) => {
      btn.onclick = () => {
        filter = btn.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b === btn))
        );
        render();
      };
    });

    $("clear").onclick = () => { todos = todos.filter((t) => !t.done); update(); };

    // Tabata timer: work and rest intervals in minutes, repeated for N rounds.
    const TKEY = "todo-claude-timer-v1";
    const saved = (() => {
      try { return JSON.parse(localStorage.getItem(TKEY)) || {}; }
      catch { return {}; }
    })();
    const settings = { work: 20, rest: 10, rounds: 4, ...saved.settings };
    let focusId = saved.focusId ?? null;
    let phase = "idle"; // idle | work | rest | done
    let round = 1;
    let running = false;
    let endsAt = 0;
    let remaining = settings.work * 60000;
    let audio = null;
    let wakeLock = null;

    function saveTimer() {
      try { localStorage.setItem(TKEY, JSON.stringify({ settings, focusId })); } catch {}
    }

    const lengthOf = (p) => (p === "rest" ? settings.rest : settings.work) * 60000;

    function beep(times) {
      if (!audio) return;
      for (let i = 0; i < times; i++) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        const t = audio.currentTime + i * 0.25;
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain).connect(audio.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      }
    }

    // Move to the next phase, starting it at time `at`.
    function advance(at) {
      if (phase === "work" && round >= settings.rounds) {
        phase = "done";
        running = false;
        remaining = 0;
        releaseWakeLock();
        beep(3);
        return;
      }
      if (phase === "work") phase = "rest";
      else { phase = "work"; round++; }
      endsAt = at + lengthOf(phase);
      remaining = endsAt - at;
      beep(phase === "work" ? 2 : 1);
    }

    async function requestWakeLock() {
      try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
    }
    function releaseWakeLock() {
      try { wakeLock?.release(); } catch {}
      wakeLock = null;
    }

    function renderTimer() {
      const timer = $("timer");
      timer.classList.toggle("rest", phase === "rest");
      const labels = { idle: "Ready", work: "Work", rest: "Rest", done: "Done" };
      $("phase").textContent = labels[phase] + (phase !== "idle" && phase !== "done" && !running ? " · paused" : "");
      $("round").textContent = phase === "done" ? `${settings.rounds} rounds complete` : `Round ${round} of ${settings.rounds}`;

      const left = running ? Math.max(0, endsAt - Date.now()) : remaining;
      const secs = Math.ceil(left / 1000);
      $("clock").textContent = `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")}`;
      const total = phase === "idle" || phase === "done" ? 1 : lengthOf(phase);
      $("bar").style.width = phase === "done" ? "100%" : `${((total - left) / total) * 100}%`;

      $("start").textContent = running ? "Pause" : phase === "idle" || phase === "done" ? "Start" : "Resume";
      $("skip").disabled = phase === "idle" || phase === "done";

      const task = todos.find((t) => t.id === focusId);
      const focus = $("focus");
      focus.textContent = "";
      if (task) {
        focus.append(phase === "rest" ? "Up next: " : "Focus: ");
        const b = document.createElement("strong");
        b.textContent = task.text;
        focus.append(b);
      } else {
        focus.textContent = "Tap ▶ on a task to focus on it.";
      }
    }

    $("start").onclick = () => {
      try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch {}
      if (running) {
        remaining = endsAt - Date.now();
        running = false;
        releaseWakeLock();
      } else {
        if (phase === "idle" || phase === "done") {
          phase = "work";
          round = 1;
          remaining = lengthOf("work");
        }
        endsAt = Date.now() + remaining;
        running = true;
        requestWakeLock();
      }
      renderTimer();
    };

    $("skip").onclick = () => {
      const now = Date.now();
      advance(now);
      if (!running && phase !== "done") remaining = lengthOf(phase);
      renderTimer();
    };

    $("reset").onclick = () => {
      phase = "idle";
      round = 1;
      running = false;
      remaining = lengthOf("work");
      releaseWakeLock();
      renderTimer();
    };

    for (const [id, max] of [["work", 180], ["rest", 60], ["rounds", 20]]) {
      const field = $(id);
      field.value = settings[id];
      field.onchange = () => {
        const n = Math.round(Number(field.value));
        settings[id] = Math.min(max, Math.max(1, Number.isFinite(n) ? n : settings[id]));
        field.value = settings[id];
        if (phase === "idle") remaining = lengthOf("work");
        saveTimer();
        renderTimer();
      };
    }

    // Timestamps keep time correct even if the phone sleeps; catch up on wake.
    setInterval(() => {
      if (!running) return;
      while (running && Date.now() >= endsAt) advance(endsAt);
      renderTimer();
    }, 250);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && running) requestWakeLock();
    });

    render();
  </script>
</body>
</html>
